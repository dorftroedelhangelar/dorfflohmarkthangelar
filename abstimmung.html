<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abstimmung – Dorfflohmarkt Hangelar</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .abstimmung-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .abstimmung-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
            padding: 30px;
        }

        .abstimmung-card h2 {
            margin-top: 0;
            color: var(--green-dark);
        }

        .abstimmung-info {
            margin-bottom: 25px;
            color: #555;
        }

        .antwort-option {
            display: block;
            margin: 12px 0;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s;
        }

        .antwort-option:hover {
            background: #f5f5f5;
        }

        .antwort-option input {
            margin-right: 10px;
        }

        .email-bereich {
            margin-top: 25px;
        }

        .email-bereich label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .email-bereich input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .abstimmen-button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--green);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .abstimmen-button:hover {
            background: var(--green-dark);
        }

        .abstimmen-button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .meldung {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .meldung.erfolg {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .meldung.fehler {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .keine-abstimmung {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .zurueck {
            margin-top: 25px;
            text-align: center;
        }

        .zurueck a {
            color: var(--green);
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header class="hero">

    <div class="hero-content">

        <div class="hero-title">

            <h1>
                🏡 Dorfflohmarkt Hangelar
            </h1>

        </div>

        <div class="event-info">

            <div class="info-box">

                <span>🗳️</span>

                <p>Abstimmung</p>

            </div>

        </div>

    </div>

</header>


<main class="abstimmung-container">

    <div class="abstimmung-card">

        <div id="ladeMeldung">

            Abstimmung wird geladen ...

        </div>


        <div id="abstimmungInhalt" style="display:none;">

            <h2 id="frage"></h2>

            <div class="abstimmung-info">

              <span id="abstimmungHinweis">
    Bitte wähle eine Antwort aus und gib deine E-Mail-Adresse ein.
</span>

            </div>


            <div id="antworten"></div>


            <div class="email-bereich">

                <label for="email">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="deine@email.de"
                    required
                >

            </div>


            <button
                id="btnAbstimmen"
                class="abstimmen-button"
                onclick="stimmeAbgeben()"
            >
                Stimme abgeben
            </button>


            <div
                id="meldung"
                class="meldung"
            ></div>

        </div>


        <div class="zurueck">

           <a href="admin/pages/index.html">
    ← Zum Dashboard
</a>
        </div>

    </div>

</main>


<footer>

    © Dorfflohmarkt Hangelar

</footer>


<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbz7DnIl89GMZDBWx9xZsYjzCi9J3pb9FpiBY-jxzEgHVJJOfAVkjUEnHCHAsGZhIw-DOw/exec";


let aktiveAbstimmung = null;
let optionen = [];


async function ladeAbstimmung() {

    try {

 const daten = await new Promise((resolve, reject) => {

    const script =
        document.createElement("script");

    const callbackName =
        "abstimmungCallback";

    let timeout;

    window[callbackName] = function (daten) {

        clearTimeout(timeout);

        delete window[callbackName];

        script.remove();

        resolve(daten);
    };

    script.src =
        API_URL +
        "?format=abstimmungOeffentlichJsonp" +
        "&prefix=" +
        callbackName;

    script.onerror = function () {

        clearTimeout(timeout);

        delete window[callbackName];

        script.remove();

        reject(
            new Error(
                "Die Abstimmungsdaten konnten nicht geladen werden."
            )
        );
    };

    timeout = setTimeout(() => {

        delete window[callbackName];

        script.remove();

        reject(
            new Error(
                "Zeitüberschreitung beim Laden der Abstimmung."
            )
        );

    }, 15000);

    document.body.appendChild(script);

});


const abstimmungen =
    daten.abstimmungen;

const alleOptionen =
    daten.optionen;


// Nur Abstimmungen berücksichtigen,
// die aktiviert sind und deren Startzeit erreicht ist.
const jetzt = new Date();

const aktive =
    abstimmungen.filter(a => {

        if (String(a.status).trim() !== "Aktiv") {
            return false;
        }

        if (!a.start) {
            return true;
        }

        const start = new Date(a.start);

        if (isNaN(start.getTime())) {
            return false;
        }

        return jetzt >= start;
    });


if (aktive.length === 0) {

    document.getElementById("ladeMeldung").innerHTML = `
        <div class="keine-abstimmung">
            <h2>🗳️ Keine aktive Abstimmung</h2>
            <p>
                Zurzeit ist keine Abstimmung aktiv.
            </p>
        </div>
    `;

    return;
}


// Die erste aktive Abstimmung verwenden
aktiveAbstimmung = aktive[0];

const hinweis =
    document.getElementById("abstimmungHinweis");

if (aktiveAbstimmung.typ === "TERMIN") {

    hinweis.textContent =
        "Bitte wähle einen oder mehrere Termine aus und gib deine E-Mail-Adresse ein.";

} else {

    hinweis.textContent =
        "Bitte wähle eine Antwort aus und gib deine E-Mail-Adresse ein.";

}


optionen =
    alleOptionen
        .filter(
            option =>
                String(option.abstimmungsId) ===
                String(aktiveAbstimmung.id)
        )
        .sort(
            (a, b) =>
                Number(a.reihenfolge || 0) -
                Number(b.reihenfolge || 0)
        );


        document.getElementById("frage").textContent =
            aktiveAbstimmung.frage;


        const container =
            document.getElementById("antworten");

        container.innerHTML = "";


        


const angezeigteTermine = new Set();

optionen.forEach(option => {

    const label =
        document.createElement("label");

    label.className =
        "antwort-option";

    let antwortText = option.antwort;

    if (aktiveAbstimmung.typ === "TERMIN") {

        const datum = new Date(option.antwort);

        antwortText = datum.toLocaleDateString("de-DE", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });

        // Bereits angezeigtes Datum nicht noch einmal anzeigen
        if (angezeigteTermine.has(antwortText)) {
            return;
        }
        angezeigteTermine.add(antwortText);
    }

    label.innerHTML = `
        <input
            type="${aktiveAbstimmung.typ === "TERMIN" ? "checkbox" : "radio"}"
            name="abstimmungsantwort"
            value="${option.optionsId}"
        >
        ${antwortText}
    `;

    container.appendChild(label);

});

        document.getElementById("ladeMeldung")
            .style.display = "none";

        document.getElementById("abstimmungInhalt")
            .style.display = "block";


    } catch (fehler) {

        console.error(
            "Fehler beim Laden der Abstimmung:",
            fehler
        );

        document.getElementById("ladeMeldung").innerHTML = `
            <div class="keine-abstimmung">
                <h2>Fehler beim Laden</h2>
                <p>
                    Die Abstimmung konnte momentan nicht geladen werden.
                </p>
            </div>
        `;

    }

}


async function stimmeAbgeben() {

    const email =
        document.getElementById("email")
            .value
            .trim()
            .toLowerCase();

const ausgewaehlt =
    Array.from(
        document.querySelectorAll(
            'input[name="abstimmungsantwort"]:checked'
        )
    );


    const meldung =
        document.getElementById("meldung");

    const button =
        document.getElementById("btnAbstimmen");


    meldung.className = "meldung";

    meldung.textContent = "";


    if (ausgewaehlt.length === 0) {

        meldung.className =
            "meldung fehler";

        meldung.textContent =
            "Bitte wähle eine Antwort aus.";

        return;

    }


    if (!email) {

        meldung.className =
            "meldung fehler";

        meldung.textContent =
            "Bitte gib deine E-Mail-Adresse ein.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Stimme wird gespeichert ...";


    try {

        const url =
            API_URL +
            "?format=abstimmen" +
            "&abstimmungsId=" +
            encodeURIComponent(
                aktiveAbstimmung.id
            ) +
          "&optionsIds=" +
encodeURIComponent(
    ausgewaehlt
        .map(element => element.value)
        .join(",")
) +
            "&email=" +
            encodeURIComponent(email);


        const antwort =
            await fetch(url);


        const ergebnis =
            await antwort.json();


        if (ergebnis.erfolg) {

            meldung.className =
                "meldung erfolg";

            meldung.textContent =
                ergebnis.meldung;


            // Nach erfolgreicher Abstimmung Eingaben sperren
            document
                .querySelectorAll(
                    'input[name="abstimmungsantwort"], #email'
                )
                .forEach(element => {
                    element.disabled = true;
                });


            button.disabled = true;

            button.textContent =
                "Stimme abgegeben";


        } else {

            meldung.className =
                "meldung fehler";

            meldung.textContent =
                ergebnis.fehler ||
                "Die Stimme konnte nicht gespeichert werden.";

            button.disabled = false;

            button.textContent =
                "Stimme abgeben";

        }


    } catch (fehler) {

        console.error(
            "Fehler beim Absenden:",
            fehler
        );


        meldung.className =
            "meldung fehler";

        meldung.textContent =
            "Die Stimme konnte momentan nicht gespeichert werden.";


        button.disabled = false;

        button.textContent =
            "Stimme abgeben";

    }

}


ladeAbstimmung();

</script>


</body>

</html>
