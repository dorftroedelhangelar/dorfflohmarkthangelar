<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veranstaltungen – Dorfflohmarkt Hangelar</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🏡<br>
            <span>
                Dorfflohmarkt<br>
                Hangelar
            </span>
        </div>

        <nav>

            <a class="menu" href="index.html">
                🏠 Dashboard
            </a>

            <a class="menu" href="verkaeufer.html">
                👥 Verkäufer
            </a>

            <a class="menu" href="rundmails.html">
                📧 Rundmails
            </a>

            <a class="menu" href="abstimmungen.html">
                🗳 Abstimmungen
            </a>

            <a class="menu" href="einstellungen.html">
                ⚙ Einstellungen
            </a>

        </nav>

        <a href="../index.html" class="back">
            ⬅ Besucherkarte
        </a>

    </aside>


    <!-- HAUPTBEREICH -->
    <main>

        <div class="page-header">

            <div>
                <h1>Veranstaltungen</h1>

                <p class="page-intro">
                    Veranstaltungen verwalten und archivieren.
                </p>
            </div>

            <button id="btnNeu" class="primary-btn">
                ➕ Neue Veranstaltung
            </button>

        </div>


        <!-- VERANSTALTUNGSLISTE -->
        <section class="settings-card veranstaltungen-card">

            <h2>📅 Veranstaltungen</h2>

            <div class="table-wrapper">

                <table id="tblVeranstaltungen">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Datum</th>
                            <th>Beginn</th>
                            <th>Ende</th>
                            <th>Ort</th>
                            <th>Status</th>
                            <th>Aktionen</th>
                        </tr>

                    </thead>

                    <tbody>
                    </tbody>

                </table>

            </div>

        </section>


        <!-- NEUE VERANSTALTUNG -->
        <div
            id="fensterNeueVeranstaltung"
            class="veranstaltungs-dialog"
            style="display:none;"
        >

            <div class="veranstaltungs-dialog-content">

                <h2>➕ Neue Veranstaltung</h2>

                <div class="form-group">

                    <label for="txtName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="txtName"
                    >

                </div>


                <div class="form-group">

                    <label for="txtDatum">
                        Datum
                    </label>

                    <input
                        type="date"
                        id="txtDatum"
                    >

                </div>


                <div class="form-group">

                    <label for="txtOrt">
                        Ort
                    </label>

                    <input
                        type="text"
                        id="txtOrt"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="txtBeginn">
                            Beginn
                        </label>

                        <input
                            type="time"
                            id="txtBeginn"
                        >

                    </div>


                    <div class="form-group">

                        <label for="txtEnde">
                            Ende
                        </label>

                        <input
                            type="time"
                            id="txtEnde"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="txtStatus">
                        Status
                    </label>

                    <select id="txtStatus">

                        <option value="Vorbereitung">
                            Vorbereitung
                        </option>

                        <option value="Anmeldung">
                            Anmeldung
                        </option>

                        <option value="Abgeschlossen">
                            Abgeschlossen
                        </option>

                    </select>

                </div>


                <div class="dialog-buttons">

                    <button
                        id="btnAbbrechen"
                        class="secondary-btn"
                    >
                        ❌ Abbrechen
                    </button>

                    <button
                        id="btnSpeichern"
                        class="primary-btn"
                    >
                        💾 Speichern
                    </button>

                </div>

            </div>

        </div>


    </main>

</div>


<script src="../../config.js"></script>
<script src="../js/veranstaltungen.js"></script>

</body>

</html>
