<body>

    <!-- HAUPTBEREICH -->
    <main>

        <div class="page-header">

            <div>
                <h1>Abstimmungen</h1>

                <p class="page-intro">
                    Abstimmungen erstellen, verwalten und Ergebnisse einsehen.
                </p>
            </div>

            <button id="btnNeueAbstimmung" class="primary-btn">
                ➕ Neue Abstimmung
            </button>

        </div>


        <!-- ABSTIMMUNGSLISTE -->
        <section class="settings-card veranstaltungen-card">

            <h2>🗳 Abstimmungen</h2>

            <div class="table-wrapper">

                <table id="tblAbstimmungen">

                  <thead>

    <tr>
        <th>Frage</th>
        <th>Typ</th>
        <th>Antwortmöglichkeiten</th>
        <th>Start</th>
        <th>Ende</th>
        <th>Status</th>
        <th>Aktionen</th>
    </tr>

</thead>

                    <tbody id="tbodyAbstimmungen">
                    </tbody>

                </table>

       <!-- NEUE ABSTIMMUNG -->
<div
    id="fensterNeueAbstimmung"
    class="veranstaltungs-dialog"
    style="display:none;"
>

    <div class="veranstaltungs-dialog-content">

        <h2>➕ Neue Abstimmung</h2>


        <div class="form-group">

            <label for="txtFrage">
                Frage
            </label>

            <input
                type="text"
                id="txtFrage"
                placeholder="z. B. Welcher Termin passt euch?"
            >

        </div>


        <div class="form-group">

            <label for="txtTyp">
                Abstimmungstyp
            </label>

            <select id="txtTyp">

                <option value="TERMIN">
                    📅 Terminabstimmung
                </option>

                <option value="JA_NEIN">
                    👍 Ja / Nein
                </option>

                <option value="AUSWAHL">
                    🗳 Sonstige Abstimmung
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="txtVeranstaltungsId">
                Veranstaltung
            </label>

            <select id="txtVeranstaltungsId">

                <option value="">
                    – Keine Veranstaltung –
                </option>

            </select>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="txtStart">
                    Start
                </label>

                <input
                    type="datetime-local"
                    id="txtStart"
                >

            </div>


            <div class="form-group">

                <label for="txtEnde">
                    Ende
                </label>

                <input
                    type="datetime-local"
                    id="txtEnde"
                >

            </div>

        </div>

        <div
    id="antwortmoeglichkeiten"
    class="form-group"
>

  <label id="labelAntwortmoeglichkeiten">
    Antwortmöglichkeiten
</label>

    <div id="antwortListe">

    </div>

    <button
        type="button"
        id="btnAntwortHinzufuegen"
        class="secondary-btn"
    >
        ➕ Antwort hinzufügen
    </button>

</div>


        <div class="dialog-buttons">

            <button
                id="btnAbstimmungAbbrechen"
                class="secondary-btn"
            >
                ❌ Abbrechen
            </button>

            <button
                id="btnAbstimmungSpeichern"
                class="primary-btn"
            >
                💾 Speichern
            </button>

        </div>

    </div>

</div> 

    </main>

</div>


<script src="../../config.js"></script>

<script>

document.getElementById("btnNeueAbstimmung").addEventListener("click", function () {

        bearbeiteteAbstimmungsId = null;

    document.getElementById("fensterNeueAbstimmung").style.display = "flex";
document.getElementById("btnAbstimmungSpeichern")
    .dataset.abstimmungsId = "";

    ladeVeranstaltungenFuerAbstimmung();
    aktualisiereAntwortmoeglichkeiten();

});

document.getElementById("btnAbstimmungAbbrechen").addEventListener("click", function () {

    document.getElementById("fensterNeueAbstimmung").style.display = "none";

    bearbeiteteAbstimmungsId = null;

    document.querySelector("#fensterNeueAbstimmung h2").textContent =
        "➕ Neue Abstimmung";

    document.getElementById("btnAbstimmungSpeichern").textContent =
        "💾 Speichern";

});

 document.addEventListener("click", async function (e) {

    if (!e.target.classList.contains("btn-abstimmung-aktivieren")) {
        return;
    }

    const abstimmungsId = e.target.dataset.id;
   
    
    try {

        const response = await fetch(
    DATA_URL.replace("format=json", ""),
    {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                aktion: "aktiviereAbstimmung",
                abstimmungsId: abstimmungsId
            })
        });

        const ergebnis = await response.json();

        if (!ergebnis.erfolg) {
            throw new Error(ergebnis.fehler || "Aktivierung fehlgeschlagen.");
        }

        await ladeAbstimmungen();

    } catch (err) {

        console.error("Fehler beim Aktivieren:", err);
                alert("Fehler beim Aktivieren: " + err.message);

    }

});   

document.addEventListener("click", async function (e) {

    if (!e.target.classList.contains("btn-abstimmung-loeschen")) {
        return;
    }

    const abstimmungsId = e.target.dataset.id;

    const bestaetigt = confirm(
        "Möchtest du diese Abstimmung wirklich löschen?\n\n" +
        "Die Abstimmung, die Antwortmöglichkeiten und bereits abgegebene Stimmen werden gelöscht."
    );

    if (!bestaetigt) {
        return;
    }

    try {

        const response = await fetch(
            DATA_URL.replace("format=json", ""),
            {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    aktion: "loescheAbstimmung",
                    abstimmungsId: abstimmungsId
                })
            }
        );

        const ergebnis = await response.json();

        if (!ergebnis.erfolg) {
            throw new Error(
                ergebnis.fehler || "Löschen fehlgeschlagen."
            );
        }

        alert("Abstimmung wurde gelöscht.");

        await ladeAbstimmungen();


    } catch (err) {

        console.error("Fehler beim Löschen:", err);

        alert(
            "Fehler beim Löschen: " +
            err.message
        );

    }

});

document.addEventListener("click", function (e) {

    if (!e.target.classList.contains("btn-abstimmung-bearbeiten")) {
        return;
    }

    const abstimmungsId = e.target.dataset.id;
     bearbeiteteAbstimmungsId = abstimmungsId;

     document.querySelector("#fensterNeueAbstimmung h2").textContent =
    "✏️ Abstimmung bearbeiten";

document.getElementById("btnAbstimmungSpeichern").textContent =
    "💾 Änderungen speichern";
    document.getElementById("fensterNeueAbstimmung").style.display = "flex";

    const abstimmung = window.abstimmungen.find(
        a => String(a.id) === String(abstimmungsId)
    );

    if (!abstimmung) {
        alert("Die Abstimmung wurde nicht gefunden.");
        return;
    }

    console.log("Abstimmung zum Bearbeiten:", abstimmung);

    document.getElementById("txtFrage").value =
        abstimmung.frage || "";

    document.getElementById("txtTyp").value =
        abstimmung.typ || "";

    document.getElementById("txtVeranstaltungsId").value =
        abstimmung.veranstaltungsId || "";

    aktualisiereAntwortmoeglichkeiten();

const zugehoerigeOptionen = window.abstimmungsoptionen
    .filter(o =>
        String(o.abstimmungsId) === String(abstimmungsId)
    )
    .sort((a, b) =>
        Number(a.reihenfolge) - Number(b.reihenfolge)
    );

const liste = document.getElementById("antwortListe");

if (abstimmung.typ === "TERMIN") {

    liste.innerHTML = "";

    zugehoerigeOptionen.forEach(option => {

        const datum = new Date(option.antwort);

        if (isNaN(datum.getTime())) {
            console.error(
                "Ungültiges Datum bei Abstimmungsoption:",
                option.antwort
            );
            return;
        }

        const jahr = datum.getFullYear();
        const monat = String(datum.getMonth() + 1).padStart(2, "0");
        const tag = String(datum.getDate()).padStart(2, "0");

        const stunde = String(datum.getHours()).padStart(2, "0");
        const minute = String(datum.getMinutes()).padStart(2, "0");

        const zeile = document.createElement("div");

        zeile.className = "form-row";

        zeile.innerHTML = `
            <input
                type="date"
                class="termin-datum"
                value="${jahr}-${monat}-${tag}"
            >

            <input
                type="time"
                class="termin-uhrzeit"
                value="${stunde}:${minute}"
            >
        `;

        liste.appendChild(zeile);

    });
}
else if (abstimmung.typ === "AUSWAHL") {

    liste.innerHTML = "";

    zugehoerigeOptionen.forEach(option => {

        const zeile = document.createElement("div");

        zeile.className = "form-row";

        zeile.innerHTML = `
            <input
                type="text"
                class="antwort-input"
                value="${option.antwort}"
            >
        `;

        liste.appendChild(zeile);

    });

}

});



</script>
<script>

async function ladeVeranstaltungenFuerAbstimmung() {

    const select = document.getElementById("txtVeranstaltungsId");

    try {

        const url = DATA_URL.replace(
            "format=json",
            "format=veranstaltungen"
        );

        const response = await fetch(url);
        const veranstaltungen = await response.json();
      

        select.innerHTML = `
            <option value="">
                – Keine Veranstaltung –
            </option>
        `;

        veranstaltungen.forEach(v => {

            const option = document.createElement("option");

            option.value = v.id;

            option.textContent =
                v.name + " – " + v.datum;

            select.appendChild(option);

        });

    } catch (err) {

        console.error(
            "Fehler beim Laden der Veranstaltungen:",
            err
        );

    }

}
async function ladeAbstimmungen()
 {

    const tbody = document.getElementById("tbodyAbstimmungen");

    try {

      
    const url = DATA_URL.replace(
    "format=json",
    "format=abstimmungenAdmin"
);

const response = await fetch(url);

const daten = await response.json();

const abstimmungen =
    daten.abstimmungen;

const optionen =
    daten.optionen;

window.abstimmungen = abstimmungen;
window.abstimmungsoptionen = optionen;

        tbody.innerHTML = "";

        if (abstimmungen.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-state">
                        Noch keine Abstimmungen vorhanden.
                    </td>
                </tr>
            `;

            return;
        }

        abstimmungen.forEach(a => {

            const zugehoerigeOptionen = optionen
                .filter(o =>
                    String(o.abstimmungsId) === String(a.id)
                )
                .sort((x, y) =>
                    Number(x.reihenfolge) - Number(y.reihenfolge)
                );

           const angezeigteOptionen = new Set();

const optionenText = zugehoerigeOptionen
    .map(o => {

        if (a.typ === "TERMIN") {

            const datum = new Date(o.antwort);

            const text = datum.toLocaleString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });

            if (angezeigteOptionen.has(text)) {
                return null;
            }

            angezeigteOptionen.add(text);

            return text;
        }

        return o.antwort;

    })
    .filter(text => text !== null)
    .join(", ");

            const zeile = document.createElement("tr");

zeile.innerHTML = `
    <td>${a.frage || ""}</td>
    <td>${a.typ || ""}</td>
    <td>${optionenText}</td>
    <td>${a.start || ""}</td>
    <td>${a.ende || ""}</td>
    <td>${a.status || ""}</td>
  <td>
    <button
        type="button"
        class="secondary-btn btn-abstimmung-bearbeiten"
        data-id="${a.id}"
    >
        Bearbeiten
    </button>

    ${a.status === "Entwurf"
        ? `<button
              type="button"
              class="secondary-btn btn-abstimmung-aktivieren"
              data-id="${a.id}"
          >
              Aktivieren
          </button>`
        : a.status === "Aktiv"
            ? `<button
                  type="button"
                  class="secondary-btn btn-abstimmung-aktivieren"
                  data-id="${a.id}"
              >
                  Deaktivieren
              </button>`
            : ""
    }

    <button
        type="button"
        class="secondary-btn btn-abstimmung-loeschen"
        data-id="${a.id}"
    >
        Löschen
    </button>
</td>
`;

tbody.appendChild(zeile);

});
    } catch (err) {
        console.error("Fehler beim Laden der Abstimmungen:", err);
    }
}

ladeAbstimmungen();
let antwortZaehler = 0;
let bearbeiteteAbstimmungsId = null;

function aktualisiereAntwortmoeglichkeiten() {

    const typ = document.getElementById("txtTyp").value;
    const liste = document.getElementById("antwortListe");
    const button = document.getElementById("btnAntwortHinzufuegen");
    const label = document.getElementById("labelAntwortmoeglichkeiten");

    liste.innerHTML = "";

    if (typ === "JA_NEIN") {

        
        label.textContent = "Antwortmöglichkeiten";
        const antworten = ["Ja", "Nein"];

        antworten.forEach(antwort => {

            const zeile = document.createElement("div");

            zeile.className = "form-row";

            zeile.innerHTML = `
                <input
                    type="text"
                    class="antwort-input"
                    value="${antwort}"
                    readonly
                >
            `;

            liste.appendChild(zeile);

        });

        button.textContent = "➕ Antwort hinzufügen";
        button.style.display = "none";

    } else if (typ === "TERMIN") {

    label.textContent = "Mögliche Termine";

    button.textContent = "➕ Termin hinzufügen";
    button.style.display = "inline-block";

} else {

    label.textContent = "Antwortmöglichkeiten";

    button.textContent = "➕ Antwort hinzufügen";
    button.style.display = "inline-block";

}

}

document.getElementById("txtTyp").addEventListener(
    "change",
    aktualisiereAntwortmoeglichkeiten
);


document.getElementById("btnAntwortHinzufuegen").addEventListener("click", function () {

    const typ = document.getElementById("txtTyp").value;
    const liste = document.getElementById("antwortListe");

    const zeile = document.createElement("div");

    zeile.className = "form-row";

    if (typ === "TERMIN") {

        zeile.innerHTML = `
            <input
                type="date"
                class="termin-datum"
            >

            <input
                type="time"
                class="termin-uhrzeit"
            >

            <button
                type="button"
                class="secondary-btn antwort-entfernen"
            >
                ❌
            </button>
        `;

    } else {

        zeile.innerHTML = `
            <input
                type="text"
                class="antwort-input"
                placeholder="Antwortmöglichkeit"
            >

            <button
                type="button"
                class="secondary-btn antwort-entfernen"
            >
                ❌
            </button>
        `;

    }

    liste.appendChild(zeile);

    zeile.querySelector(".antwort-entfernen").addEventListener(
        "click",
        function () {
            zeile.remove();
        }
    );

});

document.getElementById("btnAbstimmungSpeichern").addEventListener("click", async function () {

     const speichernButton = this;

     const bearbeitungsId = this.dataset.abstimmungsId || null;

    speichernButton.disabled = true;
    speichernButton.textContent = "⏳ Speichern...";
    
    const typ = document.getElementById("txtTyp").value;

let optionen = [];

if (typ === "TERMIN") {

    optionen = Array.from(
        document.querySelectorAll("#antwortListe .form-row")
    )
    .map(zeile => {

        const datum =
            zeile.querySelector(".termin-datum")?.value || "";

        const uhrzeit =
            zeile.querySelector(".termin-uhrzeit")?.value || "";

        if (!datum || !uhrzeit) {
            return "";
        }

        return `${datum} ${uhrzeit}`;

    })
    .filter(option => option !== "");

} else {

    optionen = Array.from(
        document.querySelectorAll("#antwortListe .antwort-input")
    )
    .map(input => input.value.trim())
    .filter(option => option !== "");

}


const daten = {

    aktion: bearbeiteteAbstimmungsId
        ? "updateAbstimmung"
        : "speichereAbstimmung",

    abstimmungsId: bearbeiteteAbstimmungsId,

    veranstaltungsId:
        document.getElementById("txtVeranstaltungsId").value,

    frage:
        document.getElementById("txtFrage").value.trim(),

    typ: typ,

    start:
        document.getElementById("txtStart").value,

    ende:
        document.getElementById("txtEnde").value,

    optionen: optionen

};


    try {

        const response = await fetch(
            DATA_URL.replace("format=json", ""),
            {
                method: "POST",
                body: JSON.stringify(daten)
            }
        );


        const ergebnis = await response.json();


        if (!ergebnis.erfolg) {

            alert(
                "Fehler beim Speichern:\n" +
                (ergebnis.fehler || "Unbekannter Fehler.")
            );

            return;

        }


       alert(
    bearbeiteteAbstimmungsId
    ? "Abstimmung wurde erfolgreich geändert."
    : "Abstimmung wurde als Entwurf gespeichert."
);

document.getElementById("btnAbstimmungSpeichern")
    .dataset.abstimmungsId = "";


        document.getElementById(
            "fensterNeueAbstimmung"
        ).style.display = "none";


        await ladeAbstimmungen();

    } catch (err) {

    console.error(err);

    alert(
        "Fehler beim Speichern der Abstimmung."
    );

} finally {

    speichernButton.disabled = false;
    speichernButton.textContent = "💾 Speichern";

}

});

</script>
