<script>

document.getElementById("btnNeueAbstimmung").addEventListener("click", function () {

    document.getElementById("fensterNeueAbstimmung").style.display = "flex";

    ladeVeranstaltungenFuerAbstimmung();
    aktualisiereAntwortmoeglichkeiten();

});

    

document.getElementById("btnAbstimmungAbbrechen").addEventListener("click", function () {

    document.getElementById("fensterNeueAbstimmung").style.display = "none";

});

</script>
<script>

async function ladeVeranstaltungenFuerAbstimmung() {

    const select = document.getElementById("txtVeranstaltungsId");

    try {

        const url = DATA_URL.replace(
            "format=json",
            "format=veranstaltungen"
        );

        const response = await fetch(url);
        const veranstaltungen = await response.json();

        select.innerHTML = `
            <option value="">
                – Keine Veranstaltung –
            </option>
        `;

        veranstaltungen.forEach(v => {

            const option = document.createElement("option");

            option.value = v.id;

            option.textContent =
                v.name + " – " + v.datum;

            select.appendChild(option);

        });

    } catch (err) {

        console.error(
            "Fehler beim Laden der Veranstaltungen:",
            err
        );

    }

}

async function ladeAbstimmungen() {

    const tbody = document.getElementById("tbodyAbstimmungen");

    try {

        const url = DATA_URL.replace(
            "format=json",
            "format=abstimmungen"
        );

        const response = await fetch(url);
        const abstimmungen = await response.json();

        tbody.innerHTML = "";

        if (abstimmungen.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-state">
                        Noch keine Abstimmungen vorhanden.
                    </td>
                </tr>
            `;

            return;
        }

        abstimmungen.forEach(a => {

            const zeile = document.createElement("tr");

            zeile.innerHTML = `
                <td>${a.frage || ""}</td>
                <td>${a.typ || ""}</td>
                <td>${a.start || ""}</td>
                <td>${a.ende || ""}</td>
                <td>${a.status || ""}</td>
                <td>
                    <button
                        type="button"
                        class="secondary-btn"
                    >
                        Bearbeiten
                    </button>
                </td>
            `;

            tbody.appendChild(zeile);

        });

    } catch (err) {

        console.error(
            "Fehler beim Laden der Abstimmungen:",
            err
        );

        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    Abstimmungen konnten nicht geladen werden.
                </td>
            </tr>
        `;

    }

}

ladeAbstimmungen();
let antwortZaehler = 0;

function aktualisiereAntwortmoeglichkeiten() {

    const typ = document.getElementById("txtTyp").value;
    const liste = document.getElementById("antwortListe");
    const button = document.getElementById("btnAntwortHinzufuegen");
    const label = document.getElementById("labelAntwortmoeglichkeiten");

    liste.innerHTML = "";

    if (typ === "JA_NEIN") {

        const antworten = ["Ja", "Nein"];

        antworten.forEach(antwort => {

            const zeile = document.createElement("div");

            zeile.className = "form-row";

            zeile.innerHTML = `
                <input
                    type="text"
                    class="antwort-input"
                    value="${antwort}"
                    readonly
                >
            `;

            liste.appendChild(zeile);

        });

        button.textContent = "➕ Antwort hinzufügen";
        button.style.display = "none";

    } else if (typ === "TERMIN") {

    label.textContent = "Mögliche Termine";

    button.textContent = "➕ Termin hinzufügen";
    button.style.display = "inline-block";

} else {

    label.textContent = "Antwortmöglichkeiten";

    button.textContent = "➕ Antwort hinzufügen";
    button.style.display = "inline-block";

}

}

document.getElementById("txtTyp").addEventListener(
    "change",
    aktualisiereAntwortmoeglichkeiten
);


document.getElementById("btnAntwortHinzufuegen").addEventListener("click", function () {

    const typ = document.getElementById("txtTyp").value;
    const liste = document.getElementById("antwortListe");

    const zeile = document.createElement("div");

    zeile.className = "form-row";

    if (typ === "TERMIN") {

        zeile.innerHTML = `
            <input
                type="date"
                class="termin-datum"
            >

            <input
                type="time"
                class="termin-uhrzeit"
            >

            <button
                type="button"
                class="secondary-btn antwort-entfernen"
            >
                ❌
            </button>
        `;

    } else {

        zeile.innerHTML = `
            <input
                type="text"
                class="antwort-input"
                placeholder="Antwortmöglichkeit"
            >

            <button
                type="button"
                class="secondary-btn antwort-entfernen"
            >
                ❌
            </button>
        `;

    }

    liste.appendChild(zeile);

    zeile.querySelector(".antwort-entfernen").addEventListener(
        "click",
        function () {
            zeile.remove();
        }
    );

});

document.getElementById("btnAbstimmungSpeichern").addEventListener("click", async function () {

     const speichernButton = this;

    speichernButton.disabled = true;
    speichernButton.textContent = "⏳ Speichern...";
    
    const typ = document.getElementById("txtTyp").value;

let optionen = [];

if (typ === "TERMIN") {

    optionen = Array.from(
        document.querySelectorAll("#antwortListe .form-row")
    )
    .map(zeile => {

        const datum =
            zeile.querySelector(".termin-datum")?.value || "";

        const uhrzeit =
            zeile.querySelector(".termin-uhrzeit")?.value || "";

        if (!datum || !uhrzeit) {
            return "";
        }

        return `${datum} ${uhrzeit}`;

    })
    .filter(option => option !== "");

} else {

    optionen = Array.from(
        document.querySelectorAll("#antwortListe .antwort-input")
    )
    .map(input => input.value.trim())
    .filter(option => option !== "");

}


const daten = {

    aktion: "speichereAbstimmung",

    veranstaltungsId:
        document.getElementById("txtVeranstaltungsId").value,

    frage:
        document.getElementById("txtFrage").value.trim(),

    typ: typ,

    start:
        document.getElementById("txtStart").value,

    ende:
        document.getElementById("txtEnde").value,

    optionen: optionen

};



    try {

        const response = await fetch(
            DATA_URL.replace("format=json", ""),
            {
                method: "POST",
                body: JSON.stringify(daten)
            }
        );


        const ergebnis = await response.json();


        if (!ergebnis.erfolg) {

            alert(
                "Fehler beim Speichern:\n" +
                (ergebnis.fehler || "Unbekannter Fehler.")
            );

            return;

        }


        alert(
            "Abstimmung wurde als Entwurf gespeichert."
        );


        document.getElementById(
            "fensterNeueAbstimmung"
        ).style.display = "none";


    } catch (err) {

    console.error(err);

    alert(
        "Fehler beim Speichern der Abstimmung."
    );

} finally {

    speichernButton.disabled = false;
    speichernButton.textContent = "💾 Speichern";

}

});

</script>
